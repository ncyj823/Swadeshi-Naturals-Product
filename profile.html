<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Swadeshi Natural Products - My Profile</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/design-system.css">
  <style>
    body { font-family: var(--font-family-body, 'Poppins', sans-serif); background: var(--color-ivory, #f9f9f9); color: var(--color-text-dark, #333); margin: 0; padding: 0; }
    .profile-page-header { background: var(--color-white, white); padding: var(--space-3, 12px) var(--space-8, 32px); box-shadow: var(--shadow-subtle); display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--color-gray-light); position: sticky; top: 0; z-index: 100; }
    .profile-page-header a { text-decoration: none; font-family: var(--font-family-heading); color: var(--color-primary-dark); font-weight: var(--font-weight-bold); font-size: 1.1rem; letter-spacing: -0.3px; }
    .profile-page-header a:hover { color: var(--color-primary); }
    .container { max-width: 800px; margin: 40px auto; padding: 20px; background: var(--color-white, white); border-radius: var(--radius-lg); box-shadow: var(--shadow-card); }
    h1 { margin-top: 0; color: var(--color-primary-dark); font-family: var(--font-family-heading); }
    .profile-card { display: flex; align-items: center; gap: 20px; margin-bottom: 40px; padding-bottom: 20px; border-bottom: 1px solid var(--color-gray-light); }
    .profile-card img { width: 80px; height: 80px; border-radius: 50%; object-fit: cover; }
    .profile-info h2 { margin: 0 0 5px; font-size: 1.5rem; color: var(--color-text-dark); }
    .profile-info p { margin: 0; color: var(--color-text-muted); }
    .btn { background: var(--color-primary); color: var(--color-white); border: none; padding: var(--space-2, 8px) var(--space-4, 16px); border-radius: var(--radius-pill); cursor: pointer; text-decoration: none; font-size: var(--font-size-small); font-weight: var(--font-weight-semibold); margin-top: 10px; display: inline-block; transition: background var(--transition-fast); }
    .btn:hover { background: var(--color-primary-dark); }
    table { width: 100%; border-collapse: collapse; margin-top: 20px; }
    th, td { text-align: left; padding: 12px; border-bottom: 1px solid var(--color-gray-light); }
    th { color: var(--color-text-muted); font-weight: var(--font-weight-medium); }
    .status { padding: 4px 10px; border-radius: var(--radius-pill); font-size: var(--font-size-caption); font-weight: var(--font-weight-semibold); }
    .status.paid { background: #e6f4ea; color: #1e8e3e; }
    .status.pending { background: #fef7e0; color: #b08d00; }
  </style>
</head>
<body>
  <header class="profile-page-header">
    <a href="/">Swadeshi Natural</a>
    <button onclick="logout()" class="btn">Logout</button>
  </header>
  
  <div class="container">
    <div id="profile-section" class="profile-card">
      <p>Loading profile...</p>
    </div>
    
    <h2>Order History</h2>
    <table>
      <thead>
        <tr>
          <th>Order ID</th>
          <th>Date</th>
          <th>Items</th>
          <th>Amount</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody id="orders-list">
        <tr><td colspan="5">Loading orders...</td></tr>
      </tbody>
    </table>
  </div>

  <!-- Global App Configuration (must load before page scripts) -->
  <script src="/app-config.js"></script>

  <script>
    async function fetchProfile() {
      try {
        const res = await fetch('/api/customer/profile', { credentials: 'include' });
        if (res.status === 401) {
          window.location.href = '/login.html';
          return;
        }
        const data = await res.json();
        const user = data.user;
        const pic = user.picture || 'https://via.placeholder.com/80';
        document.getElementById('profile-section').innerHTML = `
          <img src="${pic}" alt="Profile Picture">
          <div class="profile-info">
            <h2>${user.name || 'Customer'}</h2>
            <p>${user.email || user.phone || ''}</p>
            <p>Member since: ${user.created_at ? new Date(user.created_at).toLocaleDateString() : 'Recent'}</p>
          </div>
        `;
      } catch (err) {
        console.error(err);
      }
    }

    async function fetchOrders() {
      try {
        const res = await fetch('/api/customer/orders', { credentials: 'include' });
        if (res.status === 401) {
          window.location.href = '/login.html';
          return;
        }
        const data = await res.json();
        const orders = data.orders || [];
        const tbody = document.getElementById('orders-list');
        if (orders.length === 0) {
          tbody.innerHTML = '<tr><td colspan="5">No orders found.</td></tr>';
          return;
        }
        tbody.innerHTML = orders.map(o => `
          <tr>
            <td>${o.id}</td>
            <td>${o.createdAt ? new Date(o.createdAt).toLocaleDateString() : ''}</td>
            <td>${o.items}</td>
            <td>₹${o.amount}</td>
            <td><span class="status ${o.status && o.status.toLowerCase() === 'paid' ? 'paid' : 'pending'}">${o.status || 'Paid'}</span></td>
          </tr>
        `).join('');
      } catch (err) {
        console.error(err);
      }
    }

    async function logout() {
      try {
        await fetch('/api/customer/logout', { method: 'POST', credentials: 'include' });
      } catch (e) {
        console.error(e);
      }
      localStorage.removeItem('swadeshi_cart');
      localStorage.removeItem('swadeshi_last_uid');
      localStorage.removeItem('customer_user');
      sessionStorage.clear();
      window.location.href = '/';
    }

    fetchProfile();
    fetchOrders();
  </script>
</body>
</html>
