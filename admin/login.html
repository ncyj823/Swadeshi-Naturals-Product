<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Swadeshi Natural Products - Portal Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Playfair+Display:wght@600;700&family=Noto+Sans+Telugu:wght@600;700&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --olive: #8a9a52;
      --olive-dark: #6e7d3e;
      --pine: #1e3320;
      --pine-soft: #2a4a2c;
      --brown: #6b4c2a;
      --parchment: #faf8f2;
      --panel: #ffffff;
      --line: #e7e2d4;
      --ink: #2b2a22;
      --ink-soft: #615f51;
      --ink-faint: #94917f;
      --cream: #f5f0e8;
      --rust: #a4392b;
      --rust-bg: #fbeae6;
      --sage-bg: #eef2e3;
      --sage-text: #4f6630;
      --shadow: 0 20px 60px rgba(30, 51, 32, 0.1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: 'Poppins', 'Noto Sans Telugu', -apple-system, sans-serif;
      background:
        radial-gradient(circle at 15% 20%, rgba(138, 154, 82, 0.14), transparent 45%),
        radial-gradient(circle at 85% 80%, rgba(107, 76, 42, 0.12), transparent 45%),
        var(--parchment);
      color: var(--ink);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }

    .serif,
    .brand-logo,
    .brand-title {
      font-family: 'Playfair Display', 'Noto Sans Telugu', Georgia, serif;
    }

    .login-card {
      width: 100%;
      max-width: 440px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 24px;
      box-shadow: var(--shadow);
      padding: 40px 32px;
      animation: slideUp 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(16px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .brand-header {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      margin-bottom: 28px;
    }

    .brand-logo {
      width: 58px;
      height: 58px;
      border-radius: 18px;
      background: var(--olive);
      color: var(--pine);
      display: grid;
      place-items: center;
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 14px;
      box-shadow: 0 8px 20px rgba(138, 154, 82, 0.28);
    }

    .brand-title {
      font-size: 22px;
      font-weight: 700;
      color: var(--pine);
      line-height: 1.25;
    }

    .brand-sub {
      font-size: 11px;
      color: var(--ink-faint);
      text-transform: uppercase;
      letter-spacing: 0.12em;
      margin-top: 6px;
      font-weight: 600;
    }

    form {
      display: grid;
      gap: 16px;
    }

    .field {
      display: grid;
      gap: 6px;
    }

    label {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--ink-soft);
    }

    input {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: #fff;
      color: var(--ink);
      padding: 13px 16px;
      font-family: inherit;
      font-size: 14px;
      outline: none;
      transition: all 0.2s ease;
    }

    input:focus {
      border-color: var(--olive);
      box-shadow: 0 0 0 3px rgba(138, 154, 82, 0.18);
    }

    .field-hint {
      font-size: 11px;
      color: var(--ink-faint);
      line-height: 1.4;
    }

    .actions {
      display: grid;
      gap: 12px;
      margin-top: 8px;
    }

    .btn {
      width: 100%;
      padding: 14px 18px;
      border-radius: 14px;
      font-family: inherit;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: all 0.2s ease;
      border: none;
      text-decoration: none;
    }

    .primary {
      background: var(--olive);
      color: #ffffff;
      box-shadow: 0 4px 14px rgba(138, 154, 82, 0.25);
    }

    .primary:hover {
      background: var(--olive-dark);
      transform: translateY(-1px);
      box-shadow: 0 6px 18px rgba(138, 154, 82, 0.32);
    }

    .secondary {
      background: var(--cream);
      color: var(--pine);
      border: 1px solid var(--line);
    }

    .secondary:hover {
      background: #ece6d7;
      border-color: #dad2c0;
    }

    /* Customer Tabs & Google Btn */
    .auth-tabs {
      display: flex;
      gap: 20px;
      margin-bottom: 22px;
      border-bottom: 1px solid var(--line);
    }

    .auth-tab-btn {
      background: none;
      border: none;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      color: var(--ink-faint);
      padding-bottom: 10px;
      position: relative;
      outline: none;
      transition: color 0.2s ease;
    }

    .auth-tab-btn:hover {
      color: var(--pine);
    }

    .auth-tab-btn.active {
      color: var(--pine);
    }

    .auth-tab-btn.active::after {
      content: '';
      position: absolute;
      bottom: -1px;
      left: 0;
      right: 0;
      height: 2px;
      background: var(--olive);
      border-radius: 2px 2px 0 0;
    }



    .status {
      margin-top: 14px;
      font-size: 13px;
      line-height: 1.4;
      border-radius: 12px;
      transition: all 0.25s ease;
      display: none;
    }

    .status.active {
      display: block;
      padding: 11px 14px;
    }

    .status.error {
      background: var(--rust-bg);
      color: var(--rust);
      border: 1px solid rgba(164, 57, 43, 0.18);
    }

    .status.success {
      background: var(--sage-bg);
      color: var(--sage-text);
      border: 1px solid rgba(79, 102, 48, 0.18);
    }

    .status.info {
      background: var(--cream);
      color: var(--ink-soft);
      border: 1px solid var(--line);
    }

    .divider {
      display: flex;
      align-items: center;
      margin: 16px 0;
      color: var(--ink-faint);
      font-size: 12px;
    }

    .divider::before,
    .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--line);
    }

    .divider span {
      padding: 0 10px;
    }

    .footer {
      margin-top: 24px;
      font-size: 12px;
      color: var(--ink-faint);
      text-align: center;
    }
  </style>
</head>

<body>
  <div class="login-card">
    <div class="brand-header">
      <div class="brand-logo">స</div>
      <h1 class="brand-title">Swadeshi Natural Products</h1>
      <p class="brand-sub">Admin Portal Access</p>
    </div>

    <main class="panel">
      <form id="login-form">
        <div class="field">
          <label for="username">Username</label>
          <input id="username" name="username" autocomplete="username" required placeholder="admin">
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required placeholder="Enter password">
        </div>

        <div class="status" id="login-status"></div>

        <div class="actions">
          <!-- Option 1: Admin Login -->
          <button class="btn primary" type="submit" id="admin-login-btn">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
            Sign In to Admin
          </button>

          <div class="divider">
            <span>or</span>
          </div>

          <!-- Option 2: Go to Storefront -->
          <button class="btn secondary" type="button" id="back-home-btn">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
              <polyline points="9 22 9 12 15 12 15 22"></polyline>
            </svg>
            Go to Storefront
          </button>
        </div>
      </form>
    </main>
  </div>

  <div class="footer">Swadeshi Natural Products Portal</div>

  <!-- Global App Configuration (must load before page scripts) -->
  <script src="/app-config.js"></script>

  <script>


    function showStatus(el, message, type) {
      if (!el) return;
      el.textContent = message;
      el.className = 'status active ' + (type || 'info');
    }

    if (window.APP_CONFIG && window.APP_CONFIG.isCustomer && window.APP_CONFIG.isCustomer()) {
      // Customer Portal View
      document.title = "Swadeshi Natural Products - Customer Login";
      document.querySelectorAll('.brand-sub').forEach(el => el.textContent = "Customer Access");

      const panel = document.querySelector('.panel');
      if (panel) {
        panel.innerHTML = `
          <div class="auth-tabs">
            <button id="tab-signin" class="auth-tab-btn active">Sign In</button>
            <button id="tab-signup" class="auth-tab-btn">Register</button>
          </div>



          <form id="customer-signin-form">
            <div class="field">
              <label for="signin-identifier">Email or Mobile</label>
              <input id="signin-identifier" required placeholder="name@example.com or 9876543210">
            </div>
            <div class="field">
              <label for="signin-password">Password</label>
              <input id="signin-password" type="password" required placeholder="Enter password">
            </div>
            <button class="btn primary" type="submit">Sign In</button>
          </form>

          <form id="customer-signup-form" style="display:none;">
            <div class="field">
              <label for="signup-name">Full Name</label>
              <input id="signup-name" required placeholder="Your Name">
            </div>
            <div class="field">
              <label for="signup-email">Email Address</label>
              <input id="signup-email" type="email" required placeholder="name@example.com">
            </div>
            <div class="field">
              <label for="signup-phone">Mobile Number</label>
              <input id="signup-phone" required placeholder="9876543210">
            </div>
            <div class="field">
              <label for="signup-password">Password</label>
              <input id="signup-password" type="password" required placeholder="At least 8 characters">
              <span class="field-hint">Must contain uppercase, lowercase, & number.</span>
            </div>
            <button class="btn primary" type="submit">Create Account</button>
          </form>

          <div id="otp-section" style="display:none;">
            <h3 style="margin-bottom:8px; color:var(--pine);" class="serif">OTP Verification</h3>
            <p style="font-size:13px; color:var(--ink-soft); margin-bottom:14px;">Enter verification code sent to your phone.</p>
            <form id="otp-form">
              <input type="hidden" id="otp-user-id">
              <div class="field">
                <label for="otp-code">Code</label>
                <input id="otp-code" required placeholder="6-digit code" pattern="\\d{6}" maxlength="6">
              </div>
              <button class="btn primary" type="submit">Verify & Continue</button>
            </form>
          </div>

          <div class="status" id="login-status"></div>

          <div class="divider"><span>or</span></div>

          <button class="btn secondary" type="button" id="back-home-btn">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
              <polyline points="9 22 9 12 15 12 15 22"></polyline>
            </svg>
            Go to Storefront
          </button>
        `;

        const tabSignin = document.getElementById('tab-signin');
        const tabSignup = document.getElementById('tab-signup');
        const signinForm = document.getElementById('customer-signin-form');
        const signupForm = document.getElementById('customer-signup-form');
        const otpSection = document.getElementById('otp-section');
        const statusEl = document.getElementById('login-status');

        document.getElementById('back-home-btn').addEventListener('click', () => {
          window.location.href = window.APP_CONFIG.storefrontUrl;
        });

        tabSignin.addEventListener('click', () => {
          tabSignin.classList.add('active');
          tabSignup.classList.remove('active');
          signinForm.style.display = 'grid';
          signupForm.style.display = 'none';
          otpSection.style.display = 'none';
          statusEl.textContent = '';
          statusEl.className = 'status';
        });

        tabSignup.addEventListener('click', () => {
          tabSignup.classList.add('active');
          tabSignin.classList.remove('active');
          signinForm.style.display = 'none';
          signupForm.style.display = 'grid';
          otpSection.style.display = 'none';
          statusEl.textContent = '';
          statusEl.className = 'status';
        });

        signinForm.addEventListener('submit', async (event) => {
          event.preventDefault();
          showStatus(statusEl, 'Verifying credentials...', 'info');
          const payload = {
            identifier: document.getElementById('signin-identifier').value.trim(),
            password: document.getElementById('signin-password').value
          };

          try {
            const apiBase = window.APP_CONFIG.apiBase || '';
            const response = await fetch(apiBase + '/api/login', {
              method: 'POST',
              credentials: 'include',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(payload)
            });
            const data = await response.json();
            if (!response.ok) throw new Error(data.error || 'Login failed');

            if (data.needOtp) {
              document.getElementById('otp-user-id').value = data.userId;
              signinForm.style.display = 'none';
              otpSection.style.display = 'block';
              showStatus(statusEl, 'OTP sent to phone.', 'success');
            } else {
              window.location.href = '/';
            }
          } catch (error) {
            showStatus(statusEl, error.message || 'Login failed', 'error');
          }
        });

        signupForm.addEventListener('submit', async (event) => {
          event.preventDefault();
          showStatus(statusEl, 'Creating account...', 'info');
          const payload = {
            name: document.getElementById('signup-name').value.trim(),
            email: document.getElementById('signup-email').value.trim(),
            phone: document.getElementById('signup-phone').value.trim(),
            password: document.getElementById('signup-password').value
          };

          try {
            const apiBase = window.APP_CONFIG.apiBase || '';
            const response = await fetch(apiBase + '/api/register', {
              method: 'POST',
              credentials: 'include',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(payload)
            });
            const data = await response.json();
            if (!response.ok) throw new Error(data.error || 'Registration failed');

            showStatus(statusEl, 'Account created successfully!', 'success');
            setTimeout(() => { window.location.href = '/'; }, 1000);
          } catch (error) {
            showStatus(statusEl, error.message || 'Registration failed', 'error');
          }
        });

        document.getElementById('otp-form').addEventListener('submit', async (event) => {
          event.preventDefault();
          showStatus(statusEl, 'Verifying code...', 'info');
          const payload = {
            userId: document.getElementById('otp-user-id').value,
            otp: document.getElementById('otp-code').value.trim()
          };

          try {
            const apiBase = window.APP_CONFIG.apiBase || '';
            const response = await fetch(apiBase + '/api/verify-otp', {
              method: 'POST',
              credentials: 'include',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(payload)
            });
            const data = await response.json();
            if (!response.ok) throw new Error(data.error || 'OTP verification failed');

            showStatus(statusEl, 'Sign in successful!', 'success');
            setTimeout(() => { window.location.href = '/'; }, 1000);
          } catch (error) {
            showStatus(statusEl, error.message || 'OTP verification failed', 'error');
          }
        });
      }
    } else {
      // Admin Login flow
      const form = document.getElementById('login-form');
      const statusEl = document.getElementById('login-status');

      document.getElementById('back-home-btn').addEventListener('click', function () {
        window.location.href = window.APP_CONFIG.storefrontUrl;
      });

      form.addEventListener('submit', async function (event) {
        event.preventDefault();
        showStatus(statusEl, 'Signing in...', 'info');
        const payload = { username: form.username.value.trim(), password: form.password.value };
        try {
          const apiBase = (window.APP_CONFIG && window.APP_CONFIG.apiBase) || '';
          const response = await fetch(apiBase + '/api/login', {
            method: 'POST',
            credentials: 'include',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });
          const data = await response.json();
          if (!response.ok) throw new Error(data.error || 'Login failed');
          showStatus(statusEl, 'Success! Redirecting...', 'success');
          setTimeout(() => { window.location.href = '/admin.html'; }, 500);
        } catch (error) {
          showStatus(statusEl, error.message || 'Invalid credentials', 'error');
        }
      });
    }
  </script>
</body>

</html>
